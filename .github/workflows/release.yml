name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check tag matches version.py
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("vV")
          $ver = (Select-String -Path version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "El tag ${{ github.ref_name }} no coincide con version.py ($ver)" }

      - name: Sanity check (compileall)
        run: python -m compileall -q gui_config.py run_login.py config_store.py crypto_utils.py version.py

      - name: Build GUI executable
        run: >
          pyinstaller --noconfirm --onefile --windowed --name aLoguear
          --icon assets\icon.ico --add-data "assets;assets" gui_config.py

      - name: Build runner executable
        run: >
          pyinstaller --noconfirm --onefile --windowed --name aLoguear-runner
          --icon assets\icon.ico run_login.py

      - name: Package portable zip
        shell: pwsh
        run: |
          $portable = "dist\aLoguear-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item dist\aLoguear.exe, dist\aLoguear-runner.exe, `
            register_task.ps1, unregister_task.ps1, list_next_runs.ps1 `
            -Destination $portable
          $version = "${{ github.ref_name }}"
          $zip = "dist\aLoguear-$version-win64.zip"
          Compress-Archive -Path "$portable\*" -DestinationPath $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aLoguear-*-win64.zip
            dist/aLoguear-*-win64.zip.sha256
          generate_release_notes: true
